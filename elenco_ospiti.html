<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elenco Ospiti - Residenza Ponte D'Oro</title>
    
    <!-- Firebase v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        * { box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            margin: 0; 
            background-color: #f1f5f9; 
            color: #1e293b; 
            padding: 25px 20px;
        }

        .main-container {
            max-width: 1350px;
            margin: 0 auto;
        }

        /* HEADER E BARRA DI RICERCA */
        .search-toolbar {
            background: #ffffff;
            padding: 14px 20px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .search-input-box {
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            background: #ffffff;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            padding: 8px 14px;
            min-width: 280px;
        }
        .search-input-box input {
            border: none;
            outline: none;
            width: 100%;
            font-size: 14px;
            font-family: inherit;
        }
        .select-filtro {
            padding: 9px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 13.5px;
            outline: none;
            background: white;
            color: #334155;
            font-weight: 500;
        }
        .badge-presenti-count {
            background: #f0fdf4;
            color: #166534;
            border: 1px solid #bbf7d0;
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 13.5px;
            font-weight: bold;
            white-space: nowrap;
        }
        .btn-home {
            background: #0f766e;
            color: white;
            text-decoration: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: 0.2s;
        }
        .btn-home:hover {
            background: #115e59;
        }

        /* GRIGLIA CARD */
        .grid-cards-ospiti {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 20px;
        }

        /* CARD OSPITE */
        .ospite-card {
            background: #ffffff;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.04);
            border: 1px solid #e2e8f0;
            padding: 18px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .ospite-card:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 14px rgba(0,0,0,0.08);
        }
        .ospite-card.femmina { border-left: 6px solid #db2777; }
        .ospite-card.maschio { border-left: 6px solid #0284c7; }

        /* HEADER CARD */
        .card-header-info {
            display: flex;
            align-items: center;
            gap: 14px;
        }
        .card-avatar {
            width: 58px;
            height: 58px;
            border-radius: 8px;
            object-fit: cover;
            border: 1px solid #cbd5e1;
            background: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            color: #94a3b8;
            flex-shrink: 0;
        }
        .card-title-meta {
            flex: 1;
        }
        .card-nome {
            margin: 0;
            font-size: 16px;
            font-weight: 700;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .badge-eta {
            background: #f8fafc;
            border: 1px solid #cbd5e1;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11.5px;
            font-weight: 600;
            color: #475569;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }
        .card-cf {
            margin: 3px 0 0 0;
            font-size: 12px;
            color: #64748b;
        }

        /* DETTAGLI ANAGRAFICI */
        .dettagli-anagrafici {
            font-size: 12.5px;
            line-height: 1.5;
            color: #334155;
        }

        /* BOX REFERENTI (DATI REALI) */
        .box-referenti {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 6px;
            padding: 10px 12px;
            font-size: 12.5px;
            line-height: 1.5;
        }
        .box-referenti a {
            color: #0284c7;
            text-decoration: underline;
        }
        .no-referenti {
            color: #64748b;
            font-style: italic;
        }

        /* PULSANTI CARD */
        .card-action-buttons {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
            margin-top: auto;
            padding-top: 6px;
        }
        .btn-card {
            border: none;
            border-radius: 5px;
            padding: 8px 10px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            transition: 0.2s;
            color: white;
            flex: 1;
        }
        .btn-reparto { background: #0f766e; }
        .btn-reparto:hover { background: #115e59; }
        .btn-fascicolo { background: #1e3a5f; }
        .btn-fascicolo:hover { background: #0f2440; }
        .btn-anagrafica { background: #334155; }
        .btn-anagrafica:hover { background: #1e293b; }
    </style>
</head>
<body>

    <div class="main-container">

        <!-- BARRA DI RICERCA E CONTEGGIO -->
        <div class="search-toolbar">
            <div class="search-input-box">
                <span style="color:#64748b;">🔍</span>
                <input type="text" id="filtro_testo" placeholder="Cerca per Cognome, Nome, Età, CF o MMG..." oninput="applicaFiltri()">
            </div>
            <select class="select-filtro" id="filtro_stato" onchange="applicaFiltri()">
                <option value="PRESENTI">Solo Ospiti Presenti</option>
                <option value="TUTTI">Tutti (Inclusi dimessi/archivio)</option>
            </select>
            <div class="badge-presenti-count" id="contatore_presenti">Presenti: 0</div>
            <a href="index.html" class="btn-home">🏛️ Torna al Reparto</a>
        </div>

        <!-- GRIGLIA CARD OSPITI -->
        <div class="grid-cards-ospiti" id="contenitore-cards-ospiti">
            <div style="grid-column: 1/-1; text-align: center; padding: 40px; color:#64748b;">
                Caricamento elenco ospiti in corso...
            </div>
        </div>

    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyD2a7aK5Ze4mFF7ku4eFiz4or1pImHXoiA",
            authDomain: "residenza-ponte-d-oro.firebaseapp.com",
            databaseURL: "https://residenza-ponte-d-oro-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "residenza-ponte-d-oro",
            storageBucket: "residenza-ponte-d-oro.firebasestorage.app",
            messagingSenderId: "646708586773",
            appId: "1:646708586773:web:a9d1956abdf72ace4ba11c"
        };
        firebase.initializeApp(firebaseConfig);
        const fbDb = firebase.database();

        let dbOspiti = [];

        function forceArray(data) {
            if (!data) return [];
            return (Array.isArray(data) ? data : Object.values(data).filter(item => item !== null)).sort((a,b) => b.id - a.id);
        }

        function formattaData(iso) { 
            if(!iso) return "-"; 
            const p = iso.split('-'); 
            if(p.length < 3) return iso;
            return `${p[2]}/${p[1]}/${p[0]}`; 
        }

        function calcolaEta(dobIso) {
            if(!dobIso) return null;
            const nascita = new Date(dobIso);
            if(isNaN(nascita.getTime())) return null;
            const oggi = new Date();
            let eta = oggi.getFullYear() - nascita.getFullYear();
            const m = oggi.getMonth() - nascita.getMonth();
            if (m < 0 || (m === 0 && oggi.getDate() < nascita.getDate())) {
                eta--;
            }
            return eta > 0 ? eta : null;
        }

        firebase.auth().signInAnonymously().catch(e => console.error("Auth err:", e));
        firebase.auth().onAuthStateChanged(user => {
            if(user) {
                fbDb.ref('gestionale_db/ospiti').on('value', snap => {
                    dbOspiti = forceArray(snap.val());
                    applicaFiltri();
                });
            }
        });

        function applicaFiltri() {
            const query = (document.getElementById('filtro_testo').value || '').trim().toLowerCase();
            const filtroStato = document.getElementById('filtro_stato').value;
            const contatoreEl = document.getElementById('contatore_presenti');

            const presentiTot = dbOspiti.filter(o => !o.fine_servizio);
            if(contatoreEl) contatoreEl.innerText = `Presenti: ${presentiTot.length}`;

            let filtrati = dbOspiti;

            if(filtroStato === 'PRESENTI') {
                filtrati = filtrati.filter(o => !o.fine_servizio);
            }

            if(query) {
                filtrati = filtrati.filter(o => {
                    const nome = (o.nome || '').toLowerCase();
                    const cf = (o.cf || '').toLowerCase();
                    const mmg = (o.mmg?.nome || '').toLowerCase();
                    const comune = (o.luogo_nascita?.comune || '').toLowerCase();
                    const etaStr = String(calcolaEta(o.dob) || '');
                    return nome.includes(query) || cf.includes(query) || mmg.includes(query) || comune.includes(query) || etaStr.includes(query);
                });
            }

            renderCards(filtrati);
        }

        function renderCards(lista) {
            const container = document.getElementById('contenitore-cards-ospiti');
            container.innerHTML = '';

            if(lista.length === 0) {
                container.innerHTML = `
                    <div style="grid-column: 1/-1; text-align: center; padding: 40px; background: white; border-radius: 8px; border: 1px dashed #cbd5e1; color:#64748b;">
                        Nessun ospite trovato per i criteri di ricerca selezionati.
                    </div>
                `;
                return;
            }

            lista.forEach(o => {
                const sessoVal = String(o.sesso || '1');
                const isFemmina = sessoVal === '2' || sessoVal.toUpperCase() === 'F';
                const sessoIcon = isFemmina ? '<span style="color:#db2777; font-size:17px;">♀</span>' : '<span style="color:#0284c7; font-size:17px;">♂</span>';
                const classeGenere = isFemmina ? 'femmina' : 'maschio';

                const eta = calcolaEta(o.dob);
                const badgeEta = eta ? `<span class="badge-eta">🎂 ${eta} anni</span>` : '';

                // Foto o icona neutra
                const avatarHtml = o.foto?.dati 
                    ? `<img src="${o.foto.dati}" class="card-avatar" alt="${o.nome}">`
                    : `<div class="card-avatar">👤</div>`;

                // Nascita e Ingresso
                const luogoNas = o.luogo_nascita?.comune ? ` a ${o.luogo_nascita.comune}` : '';
                const natoTesto = o.dob ? `Nato il: <strong>${formattaData(o.dob)}</strong>${eta ? ` (${eta} anni)` : ''}${luogoNas}` : 'Nato il: -';
                const ingressoTesto = `Ingresso in struttura: <strong>${formattaData(o.ingresso)}</strong>`;

                // Box Contatti / Referenti reali
                let contattiHtml = '';
                const haFamiglia = o.familiare && o.familiare.nome;
                const haMmg = o.mmg && o.mmg.nome;
                const haAds = o.ads && o.ads.nome;

                if (!haFamiglia && !haMmg && !haAds) {
                    contattiHtml = `<div class="no-referenti">Nessun familiare registrato<br>MMG non assegnato</div>`;
                } else {
                    const righeContatti = [];
                    if (haFamiglia) {
                        const tel = o.familiare.telefono ? ` • <a href="tel:${o.familiare.telefono}">${o.familiare.telefono}</a>` : '';
                        righeContatti.push(`📞 <b>Famiglia:</b> ${o.familiare.nome} (${o.familiare.parentela || 'Parente'})${tel}`);
                    }
                    if (haMmg) {
                        const telMmg = o.mmg.tel ? ` • <a href="tel:${o.mmg.tel}">${o.mmg.tel}</a>` : '';
                        righeContatti.push(`🩺 <b>MMG:</b> ${o.mmg.nome}${telMmg}`);
                    }
                    if (haAds) {
                        const telAds = o.ads.tel ? ` • <a href="tel:${o.ads.tel}">${o.ads.tel}</a>` : '';
                        righeContatti.push(`⚖️ <b>AdS:</b> ${o.ads.nome}${telAds}`);
                    }
                    contattiHtml = righeContatti.join('<br>');
                }

                container.innerHTML += `
                    <div class="ospite-card ${classeGenere}">
                        
                        <!-- Intestazione con Foto, Nome, Sesso ed Età -->
                        <div class="card-header-info">
                            ${avatarHtml}
                            <div class="card-title-meta">
                                <h3 class="card-nome">
                                    ${sessoIcon}
                                    <span>${o.nome}</span>
                                    ${badgeEta}
                                </h3>
                                <p class="card-cf">CF: ${o.cf || '-'}</p>
                            </div>
                        </div>

                        <!-- Date Anagrafiche -->
                        <div class="dettagli-anagrafici">
                            ${natoTesto}<br>
                            ${ingressoTesto}
                        </div>

                        <!-- Box Referenti Reali -->
                        <div class="box-referenti">
                            ${contattiHtml}
                        </div>

                        <!-- Pulsanti d'azione reali collegati al gestionale -->
                        <div class="card-action-buttons">
                            <button type="button" class="btn-card btn-reparto" onclick="selezionaInReparto(${o.id})">Seleziona in Reparto</button>
                            <a href="fascicolo_bina_pai.html?id=${o.id}" class="btn-card btn-fascicolo">Fascicolo PAI ↗</a>
                            <a href="anagrafica_ospiti.html?id=${o.id}" class="btn-card btn-anagrafica">Anagrafica ↗</a>
                        </div>

                    </div>
                `;
            });
        }

        function selezionaInReparto(id) {
            window.location.href = `index.html?sel_ospite=${id}`;
        }
    </script>
</body>
</html>
